format: nimicoding.authority/v2
owner: team.storybook
scope: storybook.data-model
units:
  - id: definition.storybook.data-model.truth-package-record
    kind: definition
    title: Truth package root record
    meaning: The canonical StorybookTruthPackage record has schema_version 1 at src/storybook/engine/truth.ts and requires the top-level fields id, projectId, version, governance, rules, scenarioFrame, sourceCast, bible, adaptationBrief, visualStyleGuide, divergences, branchTopology, stateEndingMatrix, chapters, assets, evidence, derivations, projectionInputs, feedback, compat, and realmImports.
  - id: definition.storybook.data-model.truth-ref
    kind: definition
    title: Truth reference
    meaning: A TruthRef is a resolvable reference to a known canonical record.
  - id: definition.storybook.data-model.backing
    kind: definition
    title: Truth claim backing
    meaning: A truth claim backing is an evidence binding, a derivation, or an approved divergence.
  - id: definition.storybook.data-model.projection-input
    kind: definition
    title: Projection input
    meaning: A projection input declares a projection type and one or more governing truth refs.
  - id: definition.storybook.data-model.branch-topology
    kind: definition
    title: Branch topology
    meaning: Branch topology consists of a start chapter, chapter set, routes, and switch points.
  - id: definition.storybook.data-model.state-ending-matrix
    kind: definition
    title: State and ending matrix
    meaning: The state and ending matrix owns variables, flags, endings, and achievements.
  - id: definition.storybook.data-model.generation-run-record
    kind: definition
    title: Generation run record
    meaning: A generation run record captures request, project, kind, provenance, and output refs.
  - id: definition.storybook.data-model.source-visibility
    kind: definition
    title: Source fact visibility
    meaning: Source visibility distinguishes source private facts from public facts.
  - id: rule.storybook.data-model.r001
    kind: rule
    title: Root authority record
    modality: must
    statement: StorybookTruthPackage is the root record for project authority and conforms to the registered canonical record shape.
    condition: Whenever Storybook creates, reads, validates, or projects project authority.
    failure: Reject a project authority record that is not a conforming StorybookTruthPackage.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.truth-package-record
      - type: applies_to
        target: definition.storybook.product.truth-package
  - id: rule.storybook.data-model.r002
    kind: rule
    title: Resolvable truth refs
    modality: must
    statement: Every canonical scenario, source, bible, branch topology, state matrix, chapter, asset, and rule record uses a resolvable TruthRef, and evidence, derivation, and projection records point only to known truth refs.
    condition: Whenever a canonical or supporting record stores a truth ref.
    failure: Fail truth validation and reject the unresolved or unknown truth ref.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.truth-ref
  - id: rule.storybook.data-model.r003
    kind: rule
    title: Backed truth claims
    modality: must
    statement: Every backed truth claim has an evidence binding, a derivation, or an approved divergence.
    condition: Whenever a truth claim is validated as backed or enforced as a hard rule.
    failure: Fail validation for an unbacked hard rule and do not accept the claim as backed.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.backing
  - id: rule.storybook.data-model.r004
    kind: rule
    title: Governed projection inputs
    modality: must
    statement: Every projection input declares a projection type and one or more governing truth refs that remain valid for the projection.
    condition: Whenever a projection is created, validated, or used for promotion.
    failure: Block promotion when governing truth refs are empty or the projection is stale or invalid.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.projection-input
  - id: rule.storybook.data-model.r005
    kind: rule
    title: Private fact protection
    modality: must_not
    statement: A projection or generation surface fails to distinguish source private facts from public facts or leaks private facts into player-visible output by default.
    condition: Whenever a projection or generation surface produces player-visible output.
    failure: Reject player-visible output that leaks a source private fact by default.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.source-visibility
  - id: rule.storybook.data-model.r006
    kind: rule
    title: Reachable branch topology
    modality: must
    statement: Branch topology declares a start chapter, chapter set, routes, and switch points, and every declared chapter is reachable from the start chapter.
    condition: Whenever branch topology is validated or used for Play promotion.
    failure: Fail topology validation and block promotion when any declared chapter is unreachable from the start chapter.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.branch-topology
  - id: rule.storybook.data-model.r007
    kind: rule
    title: State and ending ownership
    modality: must
    statement: The state and ending matrix owns variables, flags, endings, and achievements, and every ending anchors to a known chapter.
    condition: Whenever state, endings, or achievements are declared or validated.
    failure: Fail state and ending validation and reject an ending that does not anchor to a known chapter.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.state-ending-matrix
  - id: rule.storybook.data-model.r008
    kind: rule
    title: Generation run provenance
    modality: must
    statement: Generation runs record request, project, kind, provenance, and output refs on success or typed unavailability, and provider or model values come only from the resolved AI Config binding as provenance rather than Storybook authority.
    condition: Whenever a generation run succeeds or returns typed unavailability.
    failure: Fail run validation and accept no success record that omits required run data or treats provider or model provenance as Storybook authority.
    relations:
      - type: applies_to
        target: definition.storybook.data-model.generation-run-record
