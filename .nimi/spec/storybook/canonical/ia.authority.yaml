format: nimicoding.authority/v2
owner: team.storybook
scope: storybook.ia
units:
  - id: definition.storybook.ia.studio
    kind: definition
    title: Studio surface
    meaning: Studio is the creator surface that owns source intake, foundation review, playtest, promotion, and advanced truth and governance controls.
  - id: definition.storybook.ia.play
    kind: definition
    title: Play surface
    meaning: Play is the player surface that owns content import, experience setup, multimodal presentation, authored choices or open interaction, run continuation, and recoverable player-facing failure states.
  - id: definition.storybook.ia.settings
    kind: definition
    title: Settings surface
    meaning: Settings is the platform and app infrastructure surface that owns auth-visible state and Runtime-owned App AIConfig presentation through Nimi Kit and SDK.
  - id: rule.storybook.ia.r001
    kind: rule
    title: Primary product split
    modality: must
    statement: Storybook has Studio for creators and Play for ordinary play as its two primary product surfaces, while Settings remains platform and app infrastructure rather than a third product authoring surface.
    condition: Whenever Storybook information architecture or navigation is defined.
    failure: Reject information architecture that merges creator and player responsibilities or makes Settings a product authoring surface.
    relations:
      - type: applies_to
        target: definition.storybook.ia.play
      - type: applies_to
        target: definition.storybook.ia.settings
      - type: applies_to
        target: definition.storybook.ia.studio
  - id: rule.storybook.ia.r006
    kind: rule
    title: Local reading without an AI session
    modality: must
    statement: Valid prepared stories, saved runs and creator drafts remain readable from admitted Nimi native storage or already loaded snapshots when AI execution is unavailable; cold start requires the native content host, missing native storage exposes recovery without browser fallback, and Settings presents the actual session posture.
    condition: Whenever the Runtime session is absent, checking, or unavailable.
    failure: Preserve local work and expose a recoverable connection action without manufacturing an authenticated session or generated content.
    relations:
      - type: applies_to
        target: definition.storybook.ia.play
      - type: applies_to
        target: definition.storybook.ia.settings
      - type: applies_to
        target: definition.storybook.ia.studio
  - id: rule.storybook.ia.r007
    kind: rule
    title: Text to playable story
    modality: must
    statement: Studio accepts narrative text and a creative direction, persists the source draft, produces an AI foundation for creator review, and generates a complete branching chapter only after foundation approval, including a continuity revision against the retained source and approved foundation before admission; publishing to the local Play library requires truth and prepared-package validation.
    condition: Whenever a creator adapts narrative text into a playable story.
    failure: Preserve source and approved work on generation or validation failure, present a retry action, and do not substitute generic chapter scaffolding for generated narrative.
    relations:
      - type: applies_to
        target: definition.storybook.ia.studio
  - id: rule.storybook.ia.r002
    kind: rule
    title: Studio responsibility
    modality: must
    statement: Studio owns source intake, foundation review, playtest, promotion, and advanced truth and governance controls and may expose validation failures and truth refs.
    condition: Whenever a creator performs foundation or truth governance work.
    failure: Reject creator workflows that assign Studio responsibilities outside Studio.
    relations:
      - type: applies_to
        target: definition.storybook.ia.studio
  - id: rule.storybook.ia.r003
    kind: rule
    title: Play responsibility
    modality: must
    statement: Play owns importing and selecting content, choosing declared character and world bindings before a new run, interacting with the selected experience, and recoverable failures; editing work definitions remains in Studio.
    condition: Whenever an ordinary player reads or continues a Storybook run.
    failure: Reject Studio authoring controls from Play and expose a recoverable player-facing failure when Play cannot proceed.
    relations:
      - type: applies_to
        target: definition.storybook.ia.play
  - id: rule.storybook.ia.r004
    kind: rule
    lifecycle: removed
    title: Choice-first play
    reason: The accepted Character Card V2 and independent experience redesign permits author-chosen interaction without mandatory choices or chapters.
  - id: rule.storybook.ia.r008
    kind: rule
    title: Author-chosen interaction
    modality: must
    statement: Plain Character Card V2 supports immediate open interaction and alternate openings without a Storybook extension; authored experiences may combine dialogue, deterministic choices, and typed media locally without a mandatory global play mode.
    condition: Whenever an experience is admitted or presented in Play.
    failure: Reject an invented chapter, ending, mandatory choice set, or extension requirement imposed on an otherwise valid plain character card.
    relations:
      - type: applies_to
        target: definition.storybook.ia.play
      - type: supersedes
        target: rule.storybook.ia.r004
  - id: rule.storybook.ia.r005
    kind: rule
    title: Settings responsibility
    modality: must
    statement: Settings owns auth-visible state and Runtime-owned App AIConfig presentation through Nimi Kit and SDK without duplicating Runtime account truth, permission truth, or release truth.
    condition: Whenever Settings presents authentication or AI configuration state.
    failure: Reject duplicated account, permission, or release truth and expose infrastructure state only through Nimi Kit or SDK surfaces.
    relations:
      - type: applies_to
        target: definition.storybook.ia.settings
