format: nimicoding.authority/v2
owner: team.storybook
scope: storybook.runtime-ai
units:
  - id: definition.storybook.runtime-ai.runtime-session
    kind: definition
    title: Nimi-mediated Runtime session
    meaning: A Storybook Runtime session uses the Nimi SDK and Kit through the protected Desktop-supervised carrier or an admitted direct remote App carrier. Nimi owns identity, admission and credentials; Storybook observes the verified identity and current consumption scope without creating another account system. A technical connection is separate from identity and does not itself establish model readiness.
  - id: definition.storybook.runtime-ai.ai-config
    kind: definition
    title: Runtime-owned App AIConfig
    meaning: Runtime-owned App AIConfig stores portable capability intent surfaced through Kit model configuration UI, while Runtime owns implementation selection, authorization binding, and credential custody.
  - id: definition.storybook.runtime-ai.typed-unavailable
    kind: definition
    title: Typed generation unavailability
    meaning: Typed unavailable states cover missing Runtime, missing subject user, missing App AIConfig intent, unavailable App Access capability, model resolution failure, runtime dispatch failure, and empty artifact result.
  - id: definition.storybook.runtime-ai.surface-catalog
    kind: definition
    title: Generation surface catalog
    meaning: The Storybook generation surface catalog is the registered set of Runtime generation surface IDs.
  - id: definition.storybook.runtime-ai.surface.studio-bible
    kind: definition
    title: Studio Bible draft surface
    meaning: The nimi.storybook.studio.bible surface drafts Storybook Bible text for creator review from a premise and optional style hint.
  - id: definition.storybook.runtime-ai.surface.play-scene
    kind: definition
    title: Play scene surface
    meaning: The nimi.storybook.play.scene surface generates scene prose from governed narrative context without adding conflicting hard truth.
  - id: definition.storybook.runtime-ai.surface.play-choices
    kind: definition
    title: Play choice surface
    meaning: The nimi.storybook.play.choices surface generates short default choices for choice-first play progression.
  - id: definition.storybook.runtime-ai.surface.studio-asset
    kind: definition
    title: Studio asset surface
    meaning: The nimi.storybook.studio.asset surface generates an image artifact for a governed Storybook asset specification.
  - id: definition.storybook.runtime-ai.surface.play-experience
    kind: definition
    title: Imported experience generation
    meaning: The nimi.storybook.play.experience surface generates open character interaction or a declared text task from an admitted experience and bound resources, retaining typed results and Runtime provenance.
  - id: rule.storybook.runtime-ai.r001
    kind: rule
    title: Runtime account boundary
    modality: must
    statement: Storybook establishes or resumes Runtime access through the standard Kit Desktop or Web factory and the corresponding public SDK carrier. Native Desktop remains Home-managed; Web uses the official Nimi login and separately admitted source with first Home confirmation. Storybook performs no private registration, credential custody, self-authorization or first-party account brokering.
    condition: Whenever Storybook establishes or resumes an authenticated Runtime session.
    failure: Report the unavailable selected carrier or missing source/identity/connection without simulating a native bridge, granting permissions or replaying business requests.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.runtime-session
  - id: definition.storybook.runtime-ai.surface.studio-foundation
    kind: definition
    title: Studio adaptation foundation surface
    meaning: The nimi.storybook.studio.foundation surface produces a structured adaptation proposal with a premise, player role, cast, dramatic tension, style, and spoiler-safe direction from retained source text for creator review.
  - id: definition.storybook.runtime-ai.surface.studio-chapter
    kind: definition
    title: Studio branching chapter surface
    meaning: The nimi.storybook.studio.chapter surface produces a bounded playable chapter graph with concrete choices, state consequences, and distinct reachable endings from the approved project foundation; its output is validated and admitted with generation provenance before Play promotion.
  - id: rule.storybook.runtime-ai.r002
    kind: rule
    title: No OAuth exchange surface
    modality: must_not
    statement: Storybook implements its own OAuth/token exchange or exposes first-party credential methods through an app bridge; remote identity instead uses the platform-owned SDK/Kit scoped App flow.
    condition: Whenever a Storybook authentication or app bridge surface is defined or invoked.
    failure: Reject the exchange surface or auth shim and establish no app-owned authenticated session.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.runtime-session
  - id: rule.storybook.runtime-ai.r003
    kind: rule
    title: App AIConfig ownership
    modality: must
    statement: Runtime-owned App AIConfig stores Storybook portable capability intent through Kit model configuration UI, while Runtime owns implementation selection and Storybook owns neither provider routing, authorization binding, credential custody, nor model truth.
    condition: Whenever capability intent, model configuration, or execution selection is displayed, resolved, or used.
    failure: Treat model configuration as unavailable and expose no app-local provider route when Runtime-owned App AIConfig cannot govern the capability intent.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.ai-config
  - id: rule.storybook.runtime-ai.r004
    kind: rule
    title: Runtime SDK dispatch
    modality: must
    statement: Text, image, and future media generation dispatches only through Nimi Runtime and SDK surfaces without an app-level REST bypass around the SDK.
    condition: Whenever Storybook dispatches a generation request.
    failure: Reject an app-level REST bypass and return typed runtime dispatch unavailability.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.runtime-session
  - id: rule.storybook.runtime-ai.r005
    kind: rule
    title: No provider hardcoding
    modality: must_not
    statement: Provider or model identifiers become product constants or app-local routing rules, or Runtime-returned identifiers become authority rather than provenance records.
    condition: Whenever provider or model identifiers are configured, resolved, returned, or recorded.
    failure: Fail configuration or dispatch validation and reject any app-local route or authority claim based on provider or model identifiers.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.ai-config
  - id: rule.storybook.runtime-ai.r006
    kind: rule
    title: Typed unavailable results
    modality: must
    statement: Storybook represents missing Runtime, missing subject user, missing App AIConfig intent, unavailable App Access capability, model resolution failure, runtime dispatch failure, and empty artifact result as typed unavailable states and never fabricates generated text, choices, or assets.
    condition: Whenever any registered unavailable condition prevents a valid generated result.
    failure: Return the corresponding typed unavailable state and emit no fabricated generated text, choices, or assets.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.typed-unavailable
  - id: rule.storybook.runtime-ai.r007
    kind: rule
    title: Registered generation surfaces
    modality: must
    statement: Every Runtime generation request uses a registered Storybook surface ID from the active generation surface catalog.
    condition: Whenever Storybook creates a Runtime generation request.
    failure: Reject the generation request when its Storybook surface ID is absent from the active catalog.
    relations:
      - type: applies_to
        target: definition.storybook.runtime-ai.surface-catalog
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.play-choices
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.play-experience
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.play-scene
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.studio-asset
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.studio-bible
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.studio-chapter
      - type: applies_to
        target: definition.storybook.runtime-ai.surface.studio-foundation
