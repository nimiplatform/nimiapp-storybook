schema_version: 1
app_id: nimi.storybook
display_name: Storybook
version: 0.1.7
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1473
metadata:
  summary: 阅读和创作互动故事，让角色、选择与叙事共同推进故事体验。
  icon: assets/app-icon.png
  readme: APP_GUIDE.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-storybook
  support_url: https://github.com/nimiplatform/nimiapp-storybook/issues
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: true
    telemetry: []
    third_party_account: none
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: nimi-mediated-default
