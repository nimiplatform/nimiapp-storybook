[package]
name = "nimiapp-storybook-shell"
version = "0.1.0"
description = "Storybook — interactive narrative app (Tauri shell)"
authors = ["Nimi Team"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
nimi-shell-tauri = { path = "../../../nimi/kit/shell/tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dotenvy = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
